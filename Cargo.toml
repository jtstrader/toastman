[package]
name = "toastman"
version = "0.1.0"
description = "A lightweight tui for designing and testing APIs"
authors = ["jtstrader <jacob.thomas.strader@gmail.com>"]
license = "MIT"
edition = "2024"

[dependencies]
color-eyre = "0.6.3"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "6.0.0"
ratatui = "0.30.0"
reqwest = { version = "0.13.2", features = ["json"] }
tokio = { version = "1.50.0", features = ["full"] }

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
